<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اصنع قطتك 🐾</title>
  <link rel="stylesheet" href="Style.css">
</head>

<body>

<div class="game">

  <section class="screen active" id="startScreen">
    <div class="box">
      <div class="paw">🐾</div>
      <h1>اصنع قطتك</h1>
      <p>خلينا نصنع قطتك الصغيرة ♡</p>
      <button onclick="goTo('furScreen')">ابدأ ✦</button>
    </div>
  </section>

  <section class="screen" id="furScreen">
    <div class="box">
      <small>1 / 6</small>
      <h1>اختاري لون قطتك</h1>

      <div class="cat-preview">
        <div class="cat" id="catFur">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="cat-face">
            <div class="cat-eye left-eye"></div>
            <div class="cat-eye right-eye"></div>
            <div class="nose">♥</div>
          </div>
        </div>
      </div>

      <div class="options">
        <button onclick="chooseFur('#d9ad83')">🤎</button>
        <button onclick="chooseFur('#a9adb5')">🩶</button>
        <button onclick="chooseFur('#29272c')">🖤</button>
        <button onclick="chooseFur('#f0a45f')">🧡</button>
      </div>
    </div>
  </section>

  <section class="screen" id="eyesScreen">
    <div class="box">
      <small>2 / 6</small>
      <h1>اختاري لون عيونها</h1>

      <div class="cat-preview">
        <div class="cat" id="catEyes">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="cat-face">
            <div class="cat-eye left-eye"></div>
            <div class="cat-eye right-eye"></div>
            <div class="nose">♥</div>
          </div>
        </div>
      </div>

      <div class="eye-options">
        <button onclick="chooseEyes('#69c9dc')">أزرق 💙</button>
        <button onclick="chooseEyes('#70bd72')">أخضر 💚</button>
        <button onclick="chooseEyes('#9b6a45')">بني 🤎</button>
        <button onclick="chooseEyes('#ae7ddd')">بنفسجي 💜</button>
      </div>
    </div>
  </section>

  <section class="screen" id="nameScreen">
    <div class="box">
      <small>3 / 6</small>
      <h1>وش اسم قطتك؟</h1>

      <div class="big-cat">🐱</div>

      <input id="nameInput" maxlength="15" placeholder="اكتبي اسمها...">

      <button onclick="saveName()">هذا اسمها ♡</button>
    </div>
  </section>

  <section class="screen" id="collarScreen">
    <div class="box">
      <small>4 / 6</small>
      <h1>اختاري طوقها 🎀</h1>

      <div class="collar-options">

        <button onclick="chooseCollar('#71b77e')">
          <span class="collar green"></span>
          أخضر
        </button>

        <button onclick="chooseCollar('#6da8df')">
          <span class="collar blue"></span>
          أزرق
        </button>

        <button onclick="chooseCollar('#e88dab')">
          <span class="collar pink"></span>
          وردي
        </button>

        <button onclick="chooseCollar('#a786d3')">
          <span class="collar purple"></span>
          بنفسجي
        </button>

      </div>
    </div>
  </section>

  <section class="screen" id="houseScreen">
    <div class="box">
      <small>5 / 6</small>
      <h1>اختاري بيتها 🏠</h1>

      <div class="house-options">

        <button class="house pink-house" onclick="chooseHouse('#ffe0ec')">
          🏠
          <span>بيت وردي</span>
        </button>

        <button class="house blue-house" onclick="chooseHouse('#dcefff')">
          🏡
          <span>بيت أزرق</span>
        </button>

        <button class="house green-house" onclick="chooseHouse('#dff2dc')">
          🏠
          <span>بيت أخضر</span>
        </button>

        <button class="house purple-house" onclick="chooseHouse('#e9ddff')">
          🏡
          <span>بيت بنفسجي</span>
        </button>

      </div>
    </div>
  </section>

  <section class="screen" id="finalScreen">

    <div class="final-page">

      <h1>♡ <span id="finalName">قطتك</span> ♡</h1>

      <div class="room" id="room">

        <div class="window">☀️</div>
        <div class="plant">🌱</div>
        <div class="rug"></div>
        <div class="toy">🧶</div>
        <div class="food">🍓</div>

        <div class="final-cat">

          <div class="final-ear ear1"></div>
          <div class="final-ear ear2"></div>

          <div class="final-face">

            <div class="final-eye eye1"></div>
            <div class="final-eye eye2"></div>

            <div class="final-nose">♥</div>

          </div>

          <div class="final-body"></div>
          <div class="final-collar" id="finalCollar"></div>
          <div class="tail"></div>

        </div>

      </div>

      <p>
        <span id="finalName2">قطتك</span>
        عايشة الآن في بيتها الجديد 🐾
      </p>

    </div>

  </section>

</div>

<script src="Script.js"></script>

</body>
</html>
